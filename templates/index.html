<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emissão Automática NFS-e - GUIA Sistemas</title>
    <meta name="csrf-token" content="{{ token }}">
    <!-- Use a modern, clean Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Clean modern color palette based on standard blue and white */
            --primary: #0056b3;
            /* Deep Blue from logo vibe */
            --primary-light: #4dabf7;
            /* Lighter Cyan/Blue */
            --background: #f4f7f6;
            /* Very light cool grey/white */
            --surface: #ffffff;
            /* Pure white */
            --text-main: #2b3a4a;
            --text-muted: #6c757d;
            --success: #20c997;
            --error: #fa5252;
            --shadow: rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(77, 171, 247, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 86, 179, 0.05) 0%, transparent 40%);
        }

        .container {
            background: var(--surface);
            padding: 3rem 4rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--shadow), 0 1px 3px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            max-width: 220px;
            margin-bottom: 2rem;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.4;
        }

        .input-group {
            text-align: left;
            margin-bottom: 2rem;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper span {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 1.1rem;
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem 1rem 1rem 2.5rem;
            font-size: 1.1rem;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            background-color: #f8f9fa;
            color: var(--primary);
            font-weight: 600;
            box-sizing: border-box;
            transition: var(--transition);
            outline: none;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: var(--primary-light);
            background-color: var(--surface);
            box-shadow: 0 0 0 4px rgba(77, 171, 247, 0.15);
        }

        .btn-start {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--primary), #003d82);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0, 86, 179, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 86, 179, 0.4);
            background: linear-gradient(135deg, #004d9c, #002e63);
        }

        .btn-start:active {
            transform: translateY(1px);
        }

        .btn-start:disabled {
            background: #ced4da;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Spinner inside Button */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status-panel {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 10px;
            background: #f8f9fa;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            border-left: 4px solid transparent;
            transition: var(--transition);
            display: none;
            /* Hidden until started */
            text-align: left;
            line-height: 1.5;
        }

        .status-panel.active {
            display: block;
            animation: slideUp 0.4s ease;
        }

        .status-panel.running {
            border-left-color: var(--primary-light);
            background: rgba(77, 171, 247, 0.05);
            color: var(--primary);
        }

        .status-panel.success {
            border-left-color: var(--success);
            background: rgba(32, 201, 151, 0.05);
            color: #0ca678;
        }

        .status-panel.error {
            border-left-color: var(--error);
            background: rgba(250, 82, 82, 0.05);
            color: #e03131;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: currentColor;
        }

        .running-pulse {
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from {
                opacity: 0.4;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container-wrapper" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <!-- Logo Image with cache busting -->
        <img src="{{ url_for('static', filename='logo.png') }}?v=1" alt="GUIA Sistemas Logo" class="logo"
            style="display: block; width: 280px; height: auto; margin-bottom: 2rem; object-fit: contain;"
            onerror="this.src='https://via.placeholder.com/280x100/0056b3/ffffff?text=GUIA+Sistemas'">

        <div class="container" id="main-container">
            <h1>Automação ITUGISS</h1>
            <p class="subtitle">Emissão em lote de Notas Fiscais de Serviço (NFS-e).</p>

            <!-- Step 1: Alíquota Configuration -->
            <div id="step-config">
                <div class="input-group">
                    <label for="aliquota">Alíquota MENSAL DE ISS</label>
                    <div class="input-wrapper">
                        <span>%</span>
                        <input type="text" id="aliquota" placeholder="Ex: 2.24 ou 2,24" value="2.24" autocomplete="off">
                    </div>
                </div>

                <div style="margin-bottom: 25px; display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="headless-check" style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="headless-check" style="cursor: pointer; font-size: 0.9rem; color: var(--text-muted);">
                        Executar em Segundo Plano (Oculto)
                    </label>
                </div>

                <button id="btn-carregar" class="btn-start" onclick="carregarDados()">
                    <span class="btn-text">Analisar Planilha</span>
                    <div class="spinner" id="spinner-load"></div>
                </button>
            </div>

            <!-- Step 2: Review Table (Hidden by default) -->
            <div id="step-review" style="display: none; margin-top: 2rem; width: 100%;">
                <h2 style="font-size: 1.1rem; color: var(--primary); margin-bottom: 1rem; text-align: left;">📋 REVISÃO
                    DE EMISSÕES</h2>
                <div class="table-scroll">
                    <table id="client-table">
                        <thead>
                            <tr>
                                <th style="width: 50px; text-align: center;">
                                    <input type="checkbox" id="master-skip" style="cursor: pointer;" onchange="toggleAllSkip(this)" title="Marcar/Desmarcar Todos">
                                    <br><span style="font-size: 0.75rem;">Todos</span>
                                </th>
                                <th>Empresa</th>
                                <th style="width: 100px;">Valor (R$)</th>
                                <th>Discriminação</th>
                            </tr>
                        </thead>
                        <tbody id="client-body">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>
                </div>

                <button id="btn-iniciar" class="btn-start" style="margin-top: 1.5rem;" onclick="iniciarAutomacao()">
                    <span class="btn-text">Confirmar e Iniciar Robô</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </div>

            <div id="status-panel" class="status-panel">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <div>
                        <span class="status-indicator"></span>
                        <span id="status-text">Conectando...</span>
                    </div>
                    <div id="control-buttons" style="display: none; gap: 10px;">
                        <button id="btn-pause" class="btn-control pause" onclick="pausarAutomacao()">
                            <span>Pausar</span>
                        </button>
                        <button id="btn-resume" class="btn-control resume" onclick="retomarAutomacao()"
                            style="display: none;">
                            <span>Retomar</span>
                        </button>
                        <button id="btn-report" class="btn-control report" onclick="visualizarRelatorio()"
                            style="display: none;">
                            <span>📄 Visualizar Relatório</span>
                        </button>
                    </div>
                </div>
                <!-- Box para o Relatório -->
                <div id="report-view" style="display: none; margin-top: 15px; padding: 10px; background: white; border: 1px solid #ced4da; border-radius: 8px; font-family: monospace; font-size: 0.8rem; text-align: left; max-height: 200px; overflow-y: auto; white-space: pre-wrap; color: #495057;"></div>
            </div>
        </div>
    </div>

    <!-- Additional Styles for the Review Panel & Controls -->
    <style>
        .btn-control {
            padding: 6px 15px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-control.pause {
            background-color: #ffe066;
            color: #868e96;
        }

        .btn-control.resume {
            background-color: var(--success);
            color: white;
            box-shadow: 0 4px 10px rgba(32, 201, 151, 0.3);
        }

        .btn-control.report {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.2);
        }

        .btn-control:hover {
            transform: translateY(-2px);
        }

        #main-container.expanded {
            max-width: 900px;
            transition: max-width 0.5s ease;
        }

        .table-scroll {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th {
            background: #f8f9fa;
            padding: 12px;
            font-weight: 700;
            color: var(--primary);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #eee;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #f1f3f5;
        }

        tr.skipped {
            background-color: #f8f9fa;
            opacity: 0.6;
        }

        .td-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .edit-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        .edit-input:focus {
            border-color: var(--primary-light);
            outline: none;
            box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.1);
        }

        textarea.edit-input {
            resize: vertical;
            min-height: 60px;
        }

        /* Checkbox styling */
        .skip-check {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>

    <script>
        // Cibersegurança: Garantir que localStorage e sessionStorage não guardem dados residuais
        function limparArmazenamentoLocal() {
            try {
                localStorage.clear();
                sessionStorage.clear();
            } catch (e) {
                console.warn("Falha ao limpar armazenamento do navegador:", e);
            }
        }

        // Limpa ao carregar a página
        window.addEventListener('DOMContentLoaded', limparArmazenamentoLocal);
        // Limpa ao fechar a aba ou atualizar a página
        window.addEventListener('beforeunload', limparArmazenamentoLocal);
        window.addEventListener('unload', limparArmazenamentoLocal);

        let pollInterval;
        let originalData = [];

        // Proteção contra XSS
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Wrapper seguro para chamadas da API com token de acesso
        async function apiFetch(url, options = {}) {
            const token = document.querySelector('meta[name="csrf-token"]').content;
            options.headers = {
                ...options.headers,
                'X-Access-Token': token
            };
            return fetch(url, options);
        }

        async function carregarDados() {
            const btnLoad = document.getElementById('btn-carregar');
            const spinner = document.getElementById('spinner-load');
            const btnText = btnLoad.querySelector('.btn-text');

            btnLoad.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'Lendo Planilha...';

            try {
                const response = await apiFetch('/api/data');
                const result = await response.json();

                if (result.success) {
                    originalData = result.data;
                    renderTable(originalData);

                    // Expand UI and show table
                    document.getElementById('main-container').classList.add('expanded');
                    document.getElementById('step-config').style.display = 'none';
                    document.getElementById('step-review').style.display = 'block';
                } else {
                    alert("Erro ao carregar planilha: " + result.message);
                }
            } catch (e) {
                alert("Erro de conexão ao carregar dados.");
            } finally {
                btnLoad.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = 'Analisar Planilha';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('client-body');
            tbody.innerHTML = '';
            
            const masterSkip = document.getElementById('master-skip');
            if (masterSkip) masterSkip.checked = false;

            data.forEach((row, index) => {
                // Find column names dynamically (same logic as robot)
                const colEmpresa = Object.keys(row).find(k => k.toLowerCase().includes('empresa') || k.toLowerCase().includes('razao'));
                const colDesc = Object.keys(row).find(k => k.toLowerCase().includes('discrimina'));
                const colValor = 'VALOR';

                const tr = document.createElement('tr');
                tr.id = `row-${index}`;

                tr.innerHTML = `
                    <td style="text-align: center;">
                        <input type="checkbox" class="skip-check" onchange="toggleSkip(${index})">
                    </td>
                    <td class="td-name">
                        ${escapeHTML(row[colEmpresa])}<br>
                        <small style="color: grey; font-weight: normal;">${escapeHTML(row['CNPJ'] || '')}</small>
                    </td>
                    <td>
                        <input type="text" class="edit-input val-input" value="${escapeHTML(row[colValor])}" data-index="${index}">
                    </td>
                    <td>
                        <textarea class="edit-input desc-input" data-index="${index}">${escapeHTML(row[colDesc])}</textarea>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleSkip(index) {
            const row = document.getElementById(`row-${index}`);
            row.classList.toggle('skipped');
        }

        function toggleAllSkip(masterCheckbox) {
            const isChecked = masterCheckbox.checked;
            const skipCheckboxes = document.querySelectorAll('.skip-check');
            
            skipCheckboxes.forEach((checkbox, index) => {
                checkbox.checked = isChecked;
                const row = document.getElementById(`row-${index}`);
                if (row) {
                    if (isChecked) {
                        row.classList.add('skipped');
                    } else {
                        row.classList.remove('skipped');
                    }
                }
            });
        }

        async function iniciarAutomacao() {
            const aliquota = document.getElementById('aliquota').value;
            const isHeadless = document.getElementById('headless-check').checked;

            // Collect edited data
            const rows = document.querySelectorAll('#client-body tr');
            const finalClients = [];

            rows.forEach(tr => {
                const index = tr.id.split('-')[1];
                const isSkipped = tr.querySelector('.skip-check').checked;

                if (!isSkipped) {
                    const client = { ...originalData[index] };

                    // Dynamic column detection for keys
                    const colDesc = Object.keys(client).find(k => k.toLowerCase().includes('discrimina'));

                    // Update with UI values
                    client['VALOR'] = tr.querySelector('.val-input').value;
                    client[colDesc] = tr.querySelector('.desc-input').value;

                    finalClients.push(client);
                }
            });

            if (finalClients.length === 0) {
                alert("Nenhum cliente selecionado para emissão.");
                return;
            }

            // UI State change
            const btn = document.getElementById('btn-iniciar');
            const spinner = document.getElementById('spinner');
            const panel = document.getElementById('status-panel');
            const text = document.getElementById('status-text');
            const btnText = btn.querySelector('.btn-text');

            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'Processando...';
            panel.className = 'status-panel active running';
            text.innerText = isHeadless ? 'Iniciando robô em SEGUNDO PLANO...' : 'Iniciando o robô com seus dados revisados...';
            document.querySelector('.status-indicator').classList.add('running-pulse');

            try {
                const response = await apiFetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        aliquota: aliquota,
                        clientes: finalClients,
                        headless: isHeadless
                    })
                });

                const data = await response.json();

                if (data.success) {
                    inicarPolling();
                } else {
                    alert(data.message);
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.innerText = 'Confirmar e Iniciar Robô';
                }
            } catch (error) {
                alert("Erro ao conectar com o robô.");
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }

        function inicarPolling() {
            pollInterval = setInterval(async () => {
                try {
                    const res = await apiFetch('/api/status');
                    const data = await res.json();

                    const panel = document.getElementById('status-panel');
                    const text = document.getElementById('status-text');
                    const btnIniciar = document.getElementById('btn-iniciar');
                    const spinner = document.getElementById('spinner');
                    const btnText = btnIniciar.querySelector('.btn-text');
                    const controls = document.getElementById('control-buttons');
                    const btnPause = document.getElementById('btn-pause');
                    const btnResume = document.getElementById('btn-resume');

                    text.innerText = data.message;
                    panel.classList.add('active');

                    if (data.is_running) {
                        panel.className = 'status-panel active running';
                        document.querySelector('.status-indicator').classList.add('running-pulse');
                        btnIniciar.disabled = true;
                        spinner.style.display = 'block';
                        btnText.innerText = 'Processando...';
                        controls.style.display = 'flex';

                        if (data.is_paused) {
                            panel.className = 'status-panel active error'; // Yellow/Orange alert style
                            btnPause.style.display = 'none';
                            btnResume.style.display = 'block';
                            setInputsEnabled(true);
                        } else {
                            btnPause.style.display = 'block';
                            btnResume.style.display = 'none';
                            setInputsEnabled(false);
                        }
                    } else {
                        document.querySelector('.status-indicator').classList.remove('running-pulse');
                        spinner.style.display = 'none';
                        controls.style.display = 'none';
                        clearInterval(pollInterval);

                        if (data.error) {
                            panel.className = 'status-panel active error';
                            btnIniciar.disabled = false;
                            btnText.innerText = 'Tentar Novamente';
                            setInputsEnabled(true);
                        } else if (data.message.includes("sucesso")) {
                            panel.className = 'status-panel active success';
                            btnIniciar.disabled = true;
                            
                            // Change main button to success state completely
                            btnIniciar.style.background = 'var(--success)';
                            btnIniciar.style.boxShadow = 'none';
                            btnText.innerText = 'Processamento Concluído com sucesso!';
                            
                            // Show Report Button
                            controls.style.display = 'flex';
                            document.getElementById('btn-pause').style.display = 'none';
                            document.getElementById('btn-resume').style.display = 'none';
                            document.getElementById('btn-report').style.display = 'block';
                            
                            setInputsEnabled(false);
                        } else {
                            // Default reset state
                            btnIniciar.disabled = false;
                            btnText.innerText = 'Confirmar e Iniciar Robô';
                            setInputsEnabled(true);
                        }
                    }
                } catch (e) {
                    console.error("Polling error", e);
                }
            }, 2000);
        }

        function setInputsEnabled(enabled) {
            const inputs = document.querySelectorAll('.edit-input, .skip-check');
            inputs.forEach(input => {
                input.disabled = !enabled;
            });
        }

        async function pausarAutomacao() {
            try {
                const res = await apiFetch('/api/pause', { method: 'POST' });
                const data = await res.json();
                if (!data.success) alert(data.message);
            } catch (e) {
                alert("Erro ao enviar comando de pausa.");
            }
        }

        async function retomarAutomacao() {
            // Collect Current data (Adendos)
            const rows = document.querySelectorAll('#client-body tr');
            const currentData = [];
            rows.forEach(tr => {
                const index = tr.id.split('-')[1];
                const client = { ...originalData[index] };
                const colDesc = Object.keys(client).find(k => k.toLowerCase().includes('discrimina'));
                client['VALOR'] = tr.querySelector('.val-input').value;
                client[colDesc] = tr.querySelector('.desc-input').value;
                currentData.push(client);
            });

            try {
                const res = await apiFetch('/api/resume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clientes: currentData })
                });
                const data = await res.json();
                if (!data.success) alert(data.message);
            } catch (e) {
                alert("Erro ao enviar comando de retomada.");
            }
        }

        async function visualizarRelatorio() {
            const div = document.getElementById('report-view');
            const btn = document.getElementById('btn-report');
            
            if (div.style.display === 'block') {
                div.style.display = 'none';
                return;
            }

            btn.querySelector('span').innerText = 'Carregando...';
            try {
                const res = await apiFetch('/api/report');
                const data = await res.json();
                if (data.success) {
                    div.innerText = data.report;
                    div.style.display = 'block';
                } else {
                    alert("Erro ao carregar relatório: " + data.message);
                }
            } catch (e) {
                alert("Erro ao conectar com o servidor.");
            }
            btn.querySelector('span').innerText = '📄 Visualizar Relatório';
        }
    </script>
</body>

</html>
